# 发布：把海姆达尔 Worker 自动部署到 Cloudflare
# 触发：push 到 main（仅当 worker/src/wrangler 相关文件变化）或手动 dispatch

name: Deploy Worker

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "src/**"
      - "wrangler.toml"
      - "package.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 部署 Worker 到 Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config worker/wrangler.toml

      - name: 配置 Worker Secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # GitHub 不允许 repo secret 以 GITHUB_ 开头，故用 GH_ 前缀
          GH_APP_ID: ${{ secrets.GH_APP_ID }}
          GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
          GH_WEBHOOK_SECRET: ${{ secrets.GH_WEBHOOK_SECRET }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          # put <worker_secret名> <repo_secret对应的env变量>：只对配置了的 secret 写入，值从 stdin 传入（支持多行私钥）
          put() {
            v="${!2}"
            if [ -n "$v" ]; then
              printf '%s' "$v" | npx wrangler secret put "$1" --config worker/wrangler.toml
              echo "已写入 secret: $1"
            fi
          }
          put GITHUB_APP_ID GH_APP_ID
          put GITHUB_PRIVATE_KEY GH_APP_PRIVATE_KEY
          put WEBHOOK_SECRET GH_WEBHOOK_SECRET
          put AI_API_KEY AI_API_KEY
          put AI_BASE_URL AI_BASE_URL
          put ANTHROPIC_API_KEY ANTHROPIC_API_KEY
          put OPENAI_API_KEY OPENAI_API_KEY
